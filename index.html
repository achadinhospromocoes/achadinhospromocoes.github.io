     mundo caia no Segoe UI/Roboto do sistema. display=swap para o texto
     aparecer na hora e so trocar de fonte quando o arquivo chegar. -->

<!-- Tema aplicado antes da pintura, senao o site pisca escuro para quem
     escolheu o claro (o React so roda depois do Babel compilar). -->
<script>
  try {
    var t = localStorage.getItem('achadinhos:tema');
    if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'escuro';
    document.documentElement.dataset.tema = t;
  } catch (e) {}
</script>

<style>

/* A paleta sai do logo: verde da marca + ouro das etiquetas de desconto.
   Antes o site era azul/roxo — bonito, mas de outra marca. --acc (ouro) manda
   nos preços e no que precisa gritar; --acc2 (verde) é a identidade. */
:root {
  --bg: #060b09;
  --bg-alt: #0b1512;
  --superficie: rgba(255,255,255,.045);
  --superficie-forte: rgba(255,255,255,.078);
  --borda: rgba(255,255,255,.09);
  --borda-forte: rgba(255,255,255,.17);
  --txt: #ecf3ee;
  --muted: #93a89c;
  --acc: #ffc93c;
  --acc2: #22c55e;
  --acc2-escuro: #15803d;
  --tinta: #06140e;          /* texto por cima dos preenchimentos de destaque */
  --ok: #34d399;
  --ml: #ffe600;
  --amz: #ff9900;
  --sombra: 0 18px 40px -22px rgba(0,0,0,.85);
  --sombra-marca: 0 20px 45px -20px rgba(34,197,94,.55);
  --raio: 18px;
}
:root[data-tema="claro"] {
  --bg: #f5f8f5;
  --bg-alt: #e9f2eb;
  --superficie: #ffffff;
  --superficie-forte: #eef5f0;
  --borda: rgba(6,32,20,.10);
  --borda-forte: rgba(6,32,20,.20);
  --txt: #0c1a14;
  --muted: #5a6f63;
  /* No claro o ouro some no branco: os mesmos papéis viram âmbar escuro e
     verde-floresta, que passam no contraste sem trocar a identidade. */
  --acc: #a35a08;
  --acc2: #15803d;
  --acc2-escuro: #14532d;
  --tinta: #ffffff;
  --ok: #15803d;
  --sombra: 0 16px 34px -24px rgba(6,45,28,.45);
  --sombra-marca: 0 18px 40px -24px rgba(21,128,61,.45);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--txt);
  min-height: 100vh;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-feature-settings: "cv11", "ss01";
}
/* Brilhos de fundo: ficam presos na viewport para não esticar a página
   inteira (que agora tem milhares de cards) num gradiente gigante. */
body::before {
  content: "";
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(70rem 40rem at 10% -10%, rgba(34,197,94,.26), transparent 62%),
    radial-gradient(55rem 34rem at 92% 2%, rgba(255,201,60,.16), transparent 64%),
    linear-gradient(180deg, var(--bg-alt), var(--bg) 46%);
}
:root[data-tema="claro"] body::before {
  background:
    radial-gradient(70rem 40rem at 10% -10%, rgba(34,197,94,.20), transparent 62%),
    radial-gradient(55rem 34rem at 92% 2%, rgba(250,204,21,.20), transparent 64%),
    linear-gradient(180deg, var(--bg-alt), var(--bg) 46%);
}
a { color: inherit; text-decoration: none; }
button, input, select { font-family: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--acc2); outline-offset: 2px; border-radius: 6px; }

.wrap { max-width: 1360px; margin: 0 auto; padding: 0 18px; }

/* ---------------- topo fixo ---------------- */
.topo {
  position: sticky; top: 0; z-index: 40;
  backdrop-filter: blur(16px) saturate(140%);
  background: color-mix(in srgb, var(--bg) 80%, transparent);
  border-bottom: 1px solid var(--borda);
}
/* Fio da marca no topo: 2px de verde→ouro que amarram o cabeçalho ao logo. */
.topo::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
  background: linear-gradient(90deg, transparent, var(--acc2) 22%, var(--acc) 55%, var(--acc2) 78%, transparent);
  opacity: .8;
}
.topo-in {
  display: flex; align-items: center; gap: 14px;
  padding: 10px 0; max-width: 1360px; margin: 0 auto; padding-inline: 18px;
}
.logo { display: flex; align-items: center; gap: 11px; flex: none; }
.logo-mark {
  width: 40px; height: 40px; border-radius: 50%; flex: none; display: block;
  object-fit: cover; background: #fff;
  border: 1.5px solid color-mix(in srgb, var(--acc2) 55%, transparent);
  box-shadow: 0 6px 18px -8px rgba(34,197,94,.75);
}
.logo-emo {
  width: 40px; height: 40px; border-radius: 50%; flex: none;
  display: grid; place-items: center; font-size: 1.1rem;
  background: linear-gradient(135deg, var(--acc2), var(--acc));
  color: var(--tinta); box-shadow: 0 6px 18px -8px var(--acc2);
}
.logo-txt { display: flex; flex-direction: column; line-height: 1.05; }
/* A assinatura ("ihachei") vem do próprio logo: repetir aqui em caixa alta e
   miúda hierarquiza — marca-mãe em cima, nome do site embaixo. */
.logo-txt .assinatura {
  font-size: .58rem; font-weight: 700; letter-spacing: 1.6px;
  text-transform: uppercase; color: var(--acc2);
}
.logo-txt .nome {
  font-size: .96rem; font-weight: 800; letter-spacing: -.3px; white-space: nowrap;
}
.topo .busca-wrap { flex: 1; min-width: 0; }
.icone-btn {
  width: 38px; height: 38px; flex: none; border-radius: 12px; cursor: pointer;
  border: 1px solid var(--borda); background: var(--superficie);
  display: grid; place-items: center; font-size: 1rem;
  transition: background .15s, border-color .15s, transform .15s;
}
.icone-btn:hover { background: var(--superficie-forte); border-color: var(--borda-forte); transform: translateY(-1px); }

/* ---------------- busca ---------------- */
.busca-wrap { position: relative; }
.busca {
  width: 100%; padding: 11px 38px 11px 40px; border-radius: 13px; font-size: .93rem;
  background: var(--superficie); color: var(--txt);
  border: 1px solid var(--borda); outline: none;
  transition: border-color .15s, background .15s;
}
.busca:focus {
  border-color: var(--acc2); background: var(--superficie-forte);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc2) 18%, transparent);
}
.busca::placeholder { color: var(--muted); }
.busca-ico, .busca-x {
  position: absolute; top: 50%; transform: translateY(-50%);
  color: var(--muted); font-size: .95rem; pointer-events: none;
}
.busca-ico { left: 14px; }
.busca-x {
  right: 8px; pointer-events: auto; cursor: pointer;
  background: none; border: none; padding: 4px 8px; border-radius: 8px; line-height: 1;
}
.busca-x:hover { color: var(--txt); background: var(--superficie-forte); }

/* ---------------- hero ---------------- */
.hero { text-align: center; padding: 40px 0 26px; }

/* O logo é redondo, então o herói é redondo: um anel cônico verde→ouro girando
   devagar em volta da arte. É o único movimento contínuo da página — some
   inteiro em prefers-reduced-motion, junto com o resto das animações. */
.marca-hero { position: relative; width: 148px; height: 148px; margin: 0 auto 18px; }
.marca-hero::before {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(from 0deg, var(--acc2), var(--acc), var(--acc2-escuro), var(--acc2));
  animation: girar 9s linear infinite;
}
.marca-hero::after {
  content: ""; position: absolute; inset: -18px; border-radius: 50%;
  background: radial-gradient(circle, rgba(34,197,94,.30), transparent 68%);
  filter: blur(10px); z-index: -1;
}
/* width/height explicitos (e nao "inset: 5px" sozinho): num <img> absoluto o
   width:auto vale a largura INTRINSECA do arquivo, entao o 256px do logo
   vazava do anel e cobria o titulo. */
.avatar, .avatar-fb {
  position: absolute; top: 4px; left: 4px;
  width: calc(100% - 8px); height: calc(100% - 8px);
  border-radius: 50%; display: block;
  object-fit: cover; background: var(--bg-alt);
  /* A borda na cor do fundo abre um vao entre o anel e a arte: sem ela o verde
     do anel encosta no verde do logo e os dois viram uma mancha so. */
  border: 4px solid var(--bg);
  box-shadow: var(--sombra-marca);
}
.avatar-fb { display: grid; place-items: center; font-size: 3.4rem;
  background: linear-gradient(135deg, var(--acc2), var(--acc)); }

/* Selo de credibilidade logo acima do nome: diz o que o site faz antes de
   qualquer oferta aparecer. */
.selo {
  display: inline-flex; align-items: center; gap: 7px; margin-bottom: 14px;
  padding: 6px 15px; border-radius: 999px;
  font-size: .74rem; font-weight: 700; letter-spacing: .3px;
  color: var(--acc2);
  background: color-mix(in srgb, var(--acc2) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--acc2) 40%, transparent);
}
.selo .pulso {
  width: 7px; height: 7px; border-radius: 50%; background: var(--acc2);
  box-shadow: 0 0 0 0 color-mix(in srgb, var(--acc2) 70%, transparent);
  animation: pulsar 2.4s ease-out infinite;
}
@keyframes pulsar {
  70% { box-shadow: 0 0 0 9px transparent; }
  100% { box-shadow: 0 0 0 0 transparent; }
}
/* Fora da tela, mas ainda lido por buscador e leitor de tela. clip-path sozinho
   nao basta em navegador antigo, dai o par com o clip depreciado. */
.so-leitor {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; white-space: nowrap; border: 0;
  clip: rect(0 0 0 0); clip-path: inset(50%);
}
/* Sem o titulo, a bio virou o primeiro texto do herói: cresce um pouco e ganha
   o tom cheio (era --muted, de legenda) para nao ficar orfa embaixo do logo. */
.hero .bio {
  color: var(--txt); opacity: .82; max-width: 560px; margin: 4px auto 0;
  font-size: 1.06rem; font-weight: 500; line-height: 1.5;
}

.stats {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 26px;
}
.stat {
  position: relative; overflow: hidden;
  min-width: 128px; padding: 14px 20px; border-radius: 16px;
  background: var(--superficie); border: 1px solid var(--borda);
  transition: transform .16s, border-color .16s;
}
/* Fiozinho da marca no topo de cada número: dá acabamento sem pesar. */
.stat::before {
  content: ""; position: absolute; top: 0; left: 18%; right: 18%; height: 2px;
  background: linear-gradient(90deg, transparent, var(--acc2), transparent);
}
.stat:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--acc2) 45%, transparent); }
.stat b {
  display: block; font-size: 1.42rem; font-weight: 900; letter-spacing: -.6px;
  font-variant-numeric: tabular-nums; color: var(--acc);
}
.stat span { font-size: .68rem; text-transform: uppercase; letter-spacing: .9px; color: var(--muted); font-weight: 600; }

.redes { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; margin-top: 20px; }
.rede {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 17px; border-radius: 999px; font-weight: 600; font-size: .87rem;
  background: var(--superficie); border: 1px solid var(--borda);
  transition: transform .15s, border-color .15s, background .15s;
}
.rede:hover {
  transform: translateY(-2px); border-color: var(--acc2);
  background: color-mix(in srgb, var(--acc2) 12%, var(--superficie));
}

/* ---------------- layout ---------------- */
.conteudo {
  display: grid; grid-template-columns: 264px minmax(0, 1fr); gap: 24px;
  align-items: start; padding-bottom: 60px;
}
.filtros {
  position: sticky; top: 74px;
  max-height: calc(100vh - 92px); overflow-y: auto; overscroll-behavior: contain;
  background: var(--superficie); border: 1px solid var(--borda);
  border-radius: var(--raio); padding: 16px 14px;
  box-shadow: var(--sombra);
  scrollbar-width: thin;
}
.filtros::-webkit-scrollbar { width: 7px; }
.filtros::-webkit-scrollbar-thumb { background: var(--borda-forte); border-radius: 9px; }
.grupo + .grupo { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--borda); }
.grupo h2 {
  font-size: .68rem; text-transform: uppercase; letter-spacing: .9px;
  color: var(--muted); margin-bottom: 9px; padding-left: 4px; font-weight: 700;
}
.lista { display: flex; flex-direction: column; gap: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  width: 100%; text-align: left; background: none; border: none;
  border-radius: 10px; padding: 8px 10px;
  font-size: .86rem; font-weight: 500; cursor: pointer;
  transition: background .13s, color .13s;
}
.chip:hover { background: var(--superficie-forte); }
/* A categoria escolhida ganha uma barrinha verde na lateral: sem ela, a única
   pista era a cor do texto — fraca demais numa lista de 30 e poucas linhas. */
.chip.ativo {
  color: var(--acc2); font-weight: 800;
  background: color-mix(in srgb, var(--acc2) 13%, transparent);
  box-shadow: inset 3px 0 0 var(--acc2);
}
.chip .emo { margin-right: 7px; }
.chip .qtd { color: var(--muted); font-weight: 600; font-size: .72rem; flex: none; }
.chip.ativo .qtd { color: var(--acc2); opacity: .85; }
.chips .chip {
  width: auto; border: 1px solid var(--borda); border-radius: 999px;
  padding: 6px 13px; font-size: .8rem; font-weight: 600;
}
.chips .chip.ativo { background: var(--acc2); color: var(--tinta); border-color: var(--acc2); }

.slider { width: 100%; accent-color: var(--acc2); margin-top: 4px; }
.slider-val { display: flex; justify-content: space-between; font-size: .76rem; color: var(--muted); }
.switch {
  display: flex; align-items: center; gap: 9px; cursor: pointer;
  padding: 8px 10px; border-radius: 10px; font-size: .86rem; font-weight: 500;
}
.switch:hover { background: var(--superficie-forte); }
.switch input { accent-color: var(--acc2); width: 16px; height: 16px; cursor: pointer; }
.limpar {
  width: 100%; margin-top: 16px; padding: 10px; border-radius: 11px; cursor: pointer;
  background: none; border: 1px dashed var(--borda-forte); color: var(--muted);
  font-size: .82rem; font-weight: 600; transition: color .15s, border-color .15s;
}
.limpar:hover { color: var(--acc2); border-color: var(--acc2); }

/* ---------------- barra da vitrine ---------------- */
.barra {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap; margin-bottom: 16px;
}
.barra h2 {
  display: flex; align-items: center; gap: 9px;
  font-size: 1.06rem; font-weight: 800; letter-spacing: -.3px;
}
/* Barrinha vertical antes do título da vitrine — o mesmo verde do logo. */
.barra h2::before {
  content: ""; width: 4px; height: 1.05em; border-radius: 3px; flex: none;
  background: linear-gradient(180deg, var(--acc2), var(--acc));
}
.barra .contador { color: var(--muted); font-size: .82rem; font-weight: 500; margin-left: 13px; }
.ordem {
  padding: 9px 13px; border-radius: 11px; font-size: .84rem; font-weight: 600; cursor: pointer;
  background: var(--superficie); border: 1px solid var(--borda);
}
.ordem:focus { border-color: var(--acc2); outline: none; }
.abrir-filtros { display: none; }

.marcas { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
.marca-tag {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 8px 5px 12px; border-radius: 999px; font-size: .78rem; font-weight: 600;
  background: var(--superficie-forte); border: 1px solid var(--borda-forte);
}
.marca-tag button { background: none; border: none; cursor: pointer; color: var(--muted); font-size: .9rem; line-height: 1; }
.marca-tag button:hover { color: var(--acc2); }

/* ---------------- cards ---------------- */
.grade {
  display: grid; gap: 14px;
  grid-template-columns: repeat(auto-fill, minmax(216px, 1fr));
}
.card {
  position: relative; display: flex; flex-direction: column;
  background: var(--superficie); border: 1px solid var(--borda);
  border-radius: var(--raio); overflow: hidden;
  transition: transform .16s ease, border-color .16s, box-shadow .16s;
}
.card:hover {
  transform: translateY(-4px);
  border-color: color-mix(in srgb, var(--acc2) 42%, transparent);
  box-shadow: var(--sombra), 0 0 0 1px color-mix(in srgb, var(--acc2) 18%, transparent);
}
.card-link { display: flex; flex-direction: column; height: 100%; }

/* Sem imagem de produto nos feeds, a "capa" é uma faixa colorida derivada da
   categoria (matiz fixo por índice) com o emoji dela em marca-d'água. Dá ritmo
   visual à grade sem inventar imagem que não existe. */
/* A cor da categoria entra BEM diluida: com milhares de cards lado a lado, o
   mesmo gradiente em alfa alto virava um arco-iris que competia com o preco e
   com o selo de desconto. Aqui ela so diferencia a faixa — quem grita e o
   verde/ouro da marca. */
.capa {
  position: relative; height: 74px; flex: none;
  background:
    radial-gradient(120% 100% at 15% 0%, hsl(var(--h) 60% 55% / .17), transparent 72%),
    linear-gradient(135deg, hsl(var(--h) 45% 45% / .12), transparent 85%);
  border-bottom: 1px solid var(--borda);
  /* o recuo da esquerda e o espaco do botao de favorito, que fica por cima da
     capa: sem ele o coracao cobre o emoji da categoria no mobile (onde o botao
     esta sempre visivel, nao so no hover). */
  display: flex; align-items: center; padding: 0 12px 0 46px;
}
.capa-emo { font-size: 2.1rem; opacity: .5; filter: saturate(1.2); }
.card:hover .capa-emo { opacity: .78; }
.badge {
  position: absolute; top: 10px; right: 10px;
  background: linear-gradient(135deg, #15803d, #22c55e); color: #fff;
  font-weight: 800; font-size: .78rem; padding: 4px 10px; border-radius: 999px;
  font-variant-numeric: tabular-nums;
  box-shadow: 0 6px 16px -8px #22c55e;
}
.badge.quente { background: linear-gradient(135deg, #dc2626, #f97316); box-shadow: 0 6px 16px -8px #f97316; }
/* Etiqueta da loja: as cores são as OFICIAIS (amarelo ML, laranja Amazon) e não
   mudam com o tema — por isso a tinta é fixa e escura, e não var(--tinta), que
   fica branca no claro e sumiria em cima do amarelo. */
.loja {
  position: absolute; left: 12px; bottom: -9px;
  font-size: .61rem; font-weight: 800; padding: 3px 9px;
  border-radius: 999px; text-transform: uppercase; letter-spacing: .5px; color: #131a10;
  box-shadow: 0 4px 10px -6px rgba(0,0,0,.7);
}
.loja.ml { background: var(--ml); }
.loja.amz { background: var(--amz); }
.corpo { display: flex; flex-direction: column; gap: 7px; padding: 18px 13px 13px; flex: 1; }
.titulo {
  font-size: .855rem; line-height: 1.34; font-weight: 600; margin: 0;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.precos { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-top: auto; padding-top: 6px; }
.preco {
  font-size: 1.2rem; font-weight: 900; letter-spacing: -.6px; color: var(--acc);
  font-variant-numeric: tabular-nums;
}
.antigo { font-size: .78rem; color: var(--muted); text-decoration: line-through; }
.economia { font-size: .73rem; font-weight: 700; color: var(--ok); }
.meta { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; font-size: .73rem; color: var(--muted); }
.meta .frete { color: var(--ok); font-weight: 700; }
.views { font-size: .7rem; color: var(--muted); }
.fav {
  position: absolute; top: 8px; left: 8px; z-index: 3;
  width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
  border: none; background: rgba(8,11,22,.45); backdrop-filter: blur(4px);
  font-size: .85rem; line-height: 1; display: grid; place-items: center;
  opacity: 0; transition: opacity .15s, transform .15s;
}
.card:hover .fav, .fav.on { opacity: 1; }
.fav:hover { transform: scale(1.14); }

/* ---------------- estados / rodapé ---------------- */
.vazio { text-align: center; color: var(--muted); padding: 60px 20px; }
.vazio b { display: block; font-size: 1.05rem; color: var(--txt); margin-bottom: 6px; }
.mais { display: grid; place-items: center; padding: 30px 0 10px; }
.mais button {
  padding: 13px 32px; border-radius: 999px; cursor: pointer; font-weight: 800; font-size: .9rem;
  background: linear-gradient(135deg, var(--acc2), var(--acc)); color: var(--tinta); border: none;
  box-shadow: 0 14px 30px -14px var(--acc2); transition: transform .15s, box-shadow .15s;
}
.mais button:hover { transform: translateY(-2px); box-shadow: 0 18px 34px -14px var(--acc2); }
.fim { text-align: center; color: var(--muted); font-size: .8rem; padding: 26px 0; }

.topo-btn {
  position: fixed; right: 18px; bottom: 18px; z-index: 50;
  width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-size: 1.05rem;
  background: var(--superficie-forte); border: 1px solid var(--borda-forte); color: var(--txt);
  backdrop-filter: blur(10px); box-shadow: var(--sombra);
  transition: transform .15s, opacity .2s;
}
.topo-btn:hover { transform: translateY(-3px); }

footer {
  border-top: 1px solid var(--borda); padding: 30px 0 38px;
  text-align: center; color: var(--muted); font-size: .78rem; line-height: 1.7;
}
.rodape-logo {
  width: 48px; height: 48px; border-radius: 50%; display: block; margin: 0 auto 14px;
  opacity: .75; border: 1px solid var(--borda-forte); background: #fff;
  transition: opacity .18s;
}
.rodape-logo:hover { opacity: 1; }
.copyright { margin-top: 12px; font-weight: 600; letter-spacing: .3px; color: var(--txt); opacity: .8; }

/* Tela de carga: é HTML estático, aparece antes do React. Mostrar o logo aqui
   (em vez de um spinner genérico) faz a marca ser a primeira coisa na tela. */
#carregando { text-align: center; padding: 90px 20px; color: var(--muted); }
#carregando b { display: block; font-size: 1.05rem; color: var(--txt); margin-bottom: 4px; }
.carga-marca {
  position: relative; width: 98px; height: 98px; margin: 0 auto 18px;
  display: grid; place-items: center;
}
.carga-marca::before {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  border: 2px solid var(--borda); border-top-color: var(--acc2);
  animation: girar 1s linear infinite;
}
.carga-logo { width: 78px; height: 78px; border-radius: 50%; background: #fff; }
.spinner {
  width: 34px; height: 34px; margin: 0 auto 16px; border-radius: 50%;
  border: 3px solid var(--borda); border-top-color: var(--acc2);
  animation: girar .8s linear infinite;
}
@keyframes girar { to { transform: rotate(360deg); } }
@keyframes surgir { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.card { animation: surgir .28s ease both; }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
  html { scroll-behavior: auto; }
}

/* ---------------- responsivo ---------------- */
@media (max-width: 980px) {
  .conteudo { grid-template-columns: 1fr; }
  .filtros {
    position: fixed; inset: 0 0 0 auto; z-index: 60;
    width: min(320px, 88vw); max-height: none; height: 100%;
    border-radius: 0; border-left: 1px solid var(--borda-forte);
    background: var(--bg-alt);
    transform: translateX(100%); transition: transform .22s ease;
    padding: 18px 14px 40px;
  }
  .filtros.aberto { transform: none; }
  .abrir-filtros {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 15px; border-radius: 11px; cursor: pointer; font-size: .84rem; font-weight: 700;
    background: var(--superficie); border: 1px solid var(--borda);
  }
  /* Sticky: a gaveta tem 33 categorias: sem isso o botao de fechar sobe junto
     com a rolagem e o visitante fica preso no painel de filtros. */
  .fechar-filtros {
    display: block; position: sticky; top: -18px; z-index: 2;
    width: calc(100% + 28px); margin: -18px -14px 14px; padding: 16px 14px;
    cursor: pointer; font-weight: 800; font-size: .85rem;
    background: var(--acc2); color: var(--tinta); border: none;
    box-shadow: 0 8px 18px -12px rgba(0,0,0,.9);
  }
  .veu {
    position: fixed; inset: 0; z-index: 55; border: none;
    background: rgba(4,6,14,.6); backdrop-filter: blur(2px);
  }
  .fav { opacity: 1; }
}
@media (min-width: 981px) { .fechar-filtros, .veu { display: none; } }
@media (max-width: 620px) {
  .grade { grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 10px; }
  .capa { height: 60px; }
  .capa-emo { font-size: 1.7rem; }
  .corpo { padding: 16px 11px 12px; }
  .titulo { font-size: .8rem; }
  .preco { font-size: 1.06rem; }
  /* O nome sai do topo no celular (o logo já identifica a marca) para a busca
     ficar com largura de verdade — ela é o principal do cabeçalho. */
  .logo-txt { display: none; }
  .logo-mark, .logo-emo { width: 36px; height: 36px; }
  .hero { padding: 30px 0 18px; }
  /* O selo traz a data por extenso; nos celulares estreitos ele so cabe numa
     linha (uma pilula com texto quebrado fica torta) reduzindo corpo e recuo. */
  .selo { font-size: .68rem; padding: 5px 12px; margin-bottom: 12px; }
  .marca-hero { width: 116px; height: 116px; margin-bottom: 15px; }
  .avatar-fb { font-size: 2.7rem; }
  .stat { min-width: 104px; padding: 11px 15px; }
  .stat b { font-size: 1.25rem; }
}

  <script type="text/babel" data-presets="react,tsx">

const { useState, useMemo, useEffect, useRef, useCallback, useDeferredValue } = React;

// ---------------------------------------------------------------
// Tipos
// ---------------------------------------------------------------
type OfertaBruta = [
  string,          // 0 titulo
  string,          // 1 meio da URL
  number,          // 2 indice do molde
  number,          // 3 preco
  number | null,   // 4 preco original
  number,          // 5 desconto
  number | null,   // 6 avaliacao
  number,          // 7 indice da loja
  number,          // 8 indice da categoria
  number           // 9 frete gratis (0/1)
];

interface Dados {
  marca: string;
  assinatura: string;
  bio: string;
  logoIcone: string;   // "" quando nao ha logo.png no repo (cai no emoji)
  logoHero: string;
  gerado: string;
  porPagina: number;
  redes: [string, string][];
  lojas: [string, string][];
  cats: [string, string][];
  moldes: [string, string][];
  ofertas: OfertaBruta[];
}

interface Oferta {
  id: number;
  titulo: string;
  chave: string;      // parte "estavel" da URL: serve de id dos favoritos
  url: string;
  preco: number;
  original: number | null;
  desconto: number;
  avaliacao: number | null;
  loja: number;
  cat: number;
  frete: boolean;
  busca: string;      // titulo + categoria, sem acento, para o filtro de texto
  economia: number;
  peso: number;       // ordenacao "destaque" (ver ORDENS)
}

type Ordem = "destaque" | "desconto" | "economia" | "barato" | "caro" | "nota";

interface Faixa { rotulo: string; min: number; max: number }

// ---------------------------------------------------------------
// Utilidades
// ---------------------------------------------------------------
const dados: Dados = JSON.parse(
  (document.getElementById("dados") as HTMLScriptElement).textContent || "{}"
);

const semAcento = (s: string): string =>
  s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

const brl = (v: number): string =>
  v.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const inteiro = (v: number): string => v.toLocaleString("pt-BR");

// MD5 — precisa bater EXATAMENTE com o hashlib.md5 do Python: as chaves dos
// contadores de visualizacao (Abacus) ja existem no formato md5(url)[:16] e
// resetar tudo apagaria o historico. Calcular aqui evita mandar 16 bytes por
// oferta no JSON (centenas de KB com milhares de produtos).
const md5 = (() => {
  const S = [
    7, 12, 17, 22, 7, 12, 17, 22, 7, 12, 17, 22, 7, 12, 17, 22,
    5, 9, 14, 20, 5, 9, 14, 20, 5, 9, 14, 20, 5, 9, 14, 20,
    4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23,
    6, 10, 15, 21, 6, 10, 15, 21, 6, 10, 15, 21, 6, 10, 15, 21
  ];
  const K: number[] = [];
  for (let i = 0; i < 64; i++) K.push(Math.floor(Math.abs(Math.sin(i + 1)) * 4294967296));
  const rot = (x: number, c: number): number => (x << c) | (x >>> (32 - c));
  const hex = (n: number): string => {
    let s = "";
    for (let i = 0; i < 4; i++) s += (((n >>> (i * 8)) & 0xff) + 0x100).toString(16).slice(1);
    return s;
  };

  return (txt: string): string => {
    const bytes: number[] = Array.from(new TextEncoder().encode(txt));
    const bits = bytes.length * 8;
    bytes.push(0x80);
    while (bytes.length % 64 !== 56) bytes.push(0);
    let resto = bits;
    for (let i = 0; i < 8; i++) { bytes.push(resto % 256); resto = Math.floor(resto / 256); }

    let a0 = 0x67452301, b0 = 0xefcdab89, c0 = 0x98badcfe, d0 = 0x10325476;
    for (let off = 0; off < bytes.length; off += 64) {
      const M: number[] = [];
      for (let j = 0; j < 16; j++) {
        const k = off + j * 4;
        M.push(bytes[k] | (bytes[k + 1] << 8) | (bytes[k + 2] << 16) | (bytes[k + 3] << 24));
      }
      let A = a0, B = b0, C = c0, D = d0;
      for (let i = 0; i < 64; i++) {
        let F: number, g: number;
        if (i < 16) { F = (B & C) | (~B & D); g = i; }
        else if (i < 32) { F = (D & B) | (~D & C); g = (5 * i + 1) % 16; }
        else if (i < 48) { F = B ^ C ^ D; g = (3 * i + 5) % 16; }
        else { F = C ^ (B | ~D); g = (7 * i) % 16; }
        F = (F + A + K[i] + M[g]) | 0;
        A = D; D = C; C = B;
        B = (B + rot(F, S[i])) | 0;
      }
      a0 = (a0 + A) | 0; b0 = (b0 + B) | 0; c0 = (c0 + C) | 0; d0 = (d0 + D) | 0;
    }
    return hex(a0) + hex(b0) + hex(c0) + hex(d0);
  };
})();

// Matiz fixa por categoria: o passo primo espalha as cores sem repetir vizinhos.
const matiz = (i: number): number => (i * 47 + 18) % 360;

// Ate aqui a rolagem carrega sozinha; depois disso so no clique.
const AUTO_MAX = 480;

const FAIXAS: Faixa[] = [
  { rotulo: "Qualquer preço", min: 0, max: Infinity },
  { rotulo: "até R$ 50", min: 0, max: 50 },
  { rotulo: "R$ 50 a 100", min: 50, max: 100 },
  { rotulo: "R$ 100 a 250", min: 100, max: 250 },
  { rotulo: "R$ 250 a 500", min: 250, max: 500 },
  { rotulo: "R$ 500 a 1 mil", min: 500, max: 1000 },
  { rotulo: "acima de R$ 1 mil", min: 1000, max: Infinity }
];

const ORDENS: [Ordem, string][] = [
  ["destaque", "🔥 Destaques"],
  ["desconto", "% maior desconto"],
  ["economia", "R$ maior economia"],
  ["barato", "Menor preço"],
  ["caro", "Maior preço"],
  ["nota", "Melhor avaliação"]
];

// ---------------------------------------------------------------
// Normalizacao dos dados (uma vez, na carga)
// ---------------------------------------------------------------
const OFERTAS: Oferta[] = dados.ofertas.map((o, i) => {
  const [prefixo, sufixo] = dados.moldes[o[2]];
  const original = o[4];
  return {
    id: i,
    titulo: o[0],
    chave: o[1],
    url: prefixo + o[1] + sufixo,
    preco: o[3],
    original,
    desconto: o[5],
    avaliacao: o[6],
    loja: o[7],
    cat: o[8],
    frete: o[9] === 1,
    busca: semAcento(o[0] + " " + dados.cats[o[8]][1]),
    economia: original ? Math.max(0, original - o[3]) : 0,
    // "Destaque" = desconto com um empurrao aleatorio. Ordenar so por desconto
    // congelaria o topo da vitrine ate a proxima geracao; o ruido faz a home
    // mudar a cada visita sem tirar as melhores ofertas da frente.
    peso: o[5] + Math.random() * 14 + (o[6] ? o[6] * 2 : 0)
  };
});

const CATS_ATIVAS: number[] = (() => {
  const usadas = new Set(OFERTAS.map((o) => o.cat));
  return dados.cats.map((_, i) => i).filter((i) => usadas.has(i));
})();

// ---------------------------------------------------------------
// Favoritos (localStorage)
// ---------------------------------------------------------------
const CHAVE_FAV = "achadinhos:favoritos";

function lerFavoritos(): Set<string> {
  try {
    const cru = localStorage.getItem(CHAVE_FAV);
    return new Set<string>(cru ? (JSON.parse(cru) as string[]) : []);
  } catch {
    return new Set<string>();
  }
}

function useFavoritos(): [Set<string>, (chave: string) => void] {
  const [favs, setFavs] = useState<Set<string>>(lerFavoritos);
  const alternar = useCallback((chave: string) => {
    setFavs((atual) => {
      const novo = new Set(atual);
      if (novo.has(chave)) novo.delete(chave); else novo.add(chave);
      try { localStorage.setItem(CHAVE_FAV, JSON.stringify([...novo])); } catch { /* sem storage */ }
      return novo;
    });
  }, []);
  return [favs, alternar];
}

// ---------------------------------------------------------------
// Contador de visualizacoes (Abacus) — mesmo namespace/chave de sempre
// ---------------------------------------------------------------
const NS = "achadinhospromocoes";
const API = "https://abacus.jasoncameron.dev";

// O Abacus e um contador gratuito e leva 1 requisicao por card que aparece na
// tela. Com 120 ofertas isso dava no maximo 120 chamadas; com milhares e
// rolagem infinita, uma sessao longa mandaria milhares. O orcamento por sessao
// mantem a prova social no topo da vitrine (onde ela importa) sem abusar do
// servico — passou do limite, o card so nao mostra o "pessoas viram".
let orcamentoViews = 150;

function useViews(url: string, visivel: boolean): number | null {
  const [n, setN] = useState<number | null>(null);
  useEffect(() => {
    if (!visivel || orcamentoViews <= 0) return;
    orcamentoViews--;
    let vivo = true;
    const vk = md5(url).slice(0, 16);
    const flag = "vk_" + vk;
    let primeira = false;
    try { primeira = !sessionStorage.getItem(flag); } catch { /* sem storage */ }
    fetch(API + (primeira ? "/hit/" : "/get/") + NS + "/v-" + vk, { cache: "no-store" })
      .then((r) => (r.ok ? r.json() : null))
      .then((d: { value?: number; count?: number } | null) => {
        if (!vivo || !d) return;
        const v = typeof d.value === "number" ? d.value : (typeof d.count === "number" ? d.count : null);
        if (v === null) return;
        if (primeira) { try { sessionStorage.setItem(flag, "1"); } catch { /* ok */ } }
        setN(v);
      })
      .catch(() => { /* contador e enfeite: falhou, some */ });
    return () => { vivo = false; };
  }, [url, visivel]);
  return n;
}

// ---------------------------------------------------------------
// Componentes
// ---------------------------------------------------------------
function Card({ o, favorito, aoFavoritar }: {
  o: Oferta; favorito: boolean; aoFavoritar: (chave: string) => void;
}) {
  const ref = useRef<HTMLElement | null>(null);
  const [visivel, setVisivel] = useState(false);
  const views = useViews(o.url, visivel);
  const [lojaNome, lojaCls] = dados.lojas[o.loja];
  const [emoji, catNome] = dados.cats[o.cat];

  useEffect(() => {
    const el = ref.current;
    if (!el || visivel) return;
    const io = new IntersectionObserver((ents) => {
      if (ents.some((e) => e.isIntersecting)) { setVisivel(true); io.disconnect(); }
    }, { rootMargin: "180px" });
    io.observe(el);
    return () => io.disconnect();
  }, [visivel]);

  return (
    <article className="card" ref={ref} style={{ "--h": String(matiz(o.cat)) } as React.CSSProperties}>
      <button
        className={"fav" + (favorito ? " on" : "")}
        onClick={() => aoFavoritar(o.chave)}
        aria-pressed={favorito}
        aria-label={favorito ? "Remover dos favoritos" : "Salvar nos favoritos"}
        title={favorito ? "Remover dos favoritos" : "Salvar nos favoritos"}
      >{favorito ? "❤️" : "🤍"}</button>

      <a className="card-link" href={o.url} target="_blank" rel="noopener sponsored nofollow">
        <div className="capa">
          <span className="capa-emo" aria-hidden="true">{emoji}</span>
          <span className={"badge" + (o.desconto >= 50 ? " quente" : "")}>-{o.desconto}%</span>
          <span className={"loja " + lojaCls}>{lojaNome}</span>
        </div>
        <div className="corpo">
          <h3 className="titulo">{o.titulo}</h3>
          <div className="meta">
            <span>{emoji} {catNome}</span>
            {o.avaliacao ? <span>⭐ {o.avaliacao.toFixed(1)}</span> : null}
            {o.frete ? <span className="frete">🚚 grátis</span> : null}
          </div>
          <div className="precos">
            <span className="preco">R$ {brl(o.preco)}</span>
            {o.original ? <span className="antigo">R$ {brl(o.original)}</span> : null}
          </div>
          {o.economia > 0 ? <span className="economia">Economize R$ {brl(o.economia)}</span> : null}
          {views !== null ? <span className="views">👁 {inteiro(views)} pessoas viram</span> : null}
        </div>
      </a>
    </article>
  );
}

const CardMemo = React.memo(Card);

function Filtros(props: {
  aberto: boolean;
  fechar: () => void;
  loja: number; setLoja: (v: number) => void;
  cat: number; setCat: (v: number) => void;
  faixa: number; setFaixa: (v: number) => void;
  descMin: number; setDescMin: (v: number) => void;
  soFrete: boolean; setSoFrete: (v: boolean) => void;
  soFavs: boolean; setSoFavs: (v: boolean) => void;
  totalFavs: number;
  porLoja: number[]; porCat: Record<number, number>; total: number;
  limpar: () => void;
}) {
  return (
    <aside className={"filtros" + (props.aberto ? " aberto" : "")} id="filtros">
      <button className="fechar-filtros" onClick={props.fechar}>✓ Ver ofertas</button>

      <div className="grupo">
        <h2>Loja</h2>
        <div className="lista">
          <button className={"chip" + (props.loja === -1 ? " ativo" : "")} onClick={() => props.setLoja(-1)}>
            <span>Todas as lojas</span><span className="qtd">{inteiro(props.total)}</span>
          </button>
          {dados.lojas.map(([nome], i) => (
            <button key={nome} className={"chip" + (props.loja === i ? " ativo" : "")} onClick={() => props.setLoja(i)}>
              <span>{nome}</span><span className="qtd">{inteiro(props.porLoja[i] || 0)}</span>
            </button>
          ))}
        </div>
      </div>

      <div className="grupo">
        <h2>Categorias</h2>
        <div className="lista">
          <button className={"chip" + (props.cat === -1 ? " ativo" : "")} onClick={() => props.setCat(-1)}>
            <span>Todas as categorias</span><span className="qtd">{inteiro(props.total)}</span>
          </button>
          {CATS_ATIVAS.map((i) => (
            <button key={i} className={"chip" + (props.cat === i ? " ativo" : "")} onClick={() => props.setCat(i)}>
              <span><span className="emo">{dados.cats[i][0]}</span>{dados.cats[i][1]}</span>
              <span className="qtd">{inteiro(props.porCat[i] || 0)}</span>
            </button>
          ))}
        </div>
      </div>

      <div className="grupo">
        <h2>Preço</h2>
        <div className="chips">
          {FAIXAS.map((f, i) => (
            <button key={f.rotulo} className={"chip" + (props.faixa === i ? " ativo" : "")} onClick={() => props.setFaixa(i)}>
              {f.rotulo}
            </button>
          ))}
        </div>
      </div>

      <div className="grupo">
        <h2>Desconto mínimo</h2>
        <input
          className="slider" type="range" min={0} max={80} step={5}
          value={props.descMin}
          onChange={(e) => props.setDescMin(Number(e.target.value))}
          aria-label="Desconto mínimo"
        />
        <div className="slider-val"><span>{props.descMin}% ou mais</span><span>80%</span></div>
      </div>

      <div className="grupo">
        <h2>Filtros rápidos</h2>
        <label className="switch">
          <input type="checkbox" checked={props.soFrete} onChange={(e) => props.setSoFrete(e.target.checked)} />
          🚚 Só com frete grátis
        </label>
        <label className="switch">
          <input type="checkbox" checked={props.soFavs} onChange={(e) => props.setSoFavs(e.target.checked)} />
          ❤️ Só meus favoritos ({props.totalFavs})
        </label>
        <button className="limpar" onClick={props.limpar}>Limpar todos os filtros</button>
      </div>
    </aside>
  );
}

function App() {
  const [texto, setTexto] = useState("");
  const buscaLenta = useDeferredValue(texto);
  const [loja, setLoja] = useState(-1);
  const [cat, setCat] = useState(-1);
  const [faixa, setFaixa] = useState(0);
  const [descMin, setDescMin] = useState(0);
  const [soFrete, setSoFrete] = useState(false);
  const [soFavs, setSoFavs] = useState(false);
  const [ordem, setOrdem] = useState<Ordem>("destaque");
  const [limite, setLimite] = useState(dados.porPagina);
  const [gaveta, setGaveta] = useState(false);
  const [aoTopo, setAoTopo] = useState(false);
  const [favs, alternarFav] = useFavoritos();
  const [tema, setTema] = useState<string>(() => {
    try {
      return localStorage.getItem("achadinhos:tema")
        || (matchMedia("(prefers-color-scheme: light)").matches ? "claro" : "escuro");
    } catch { return "escuro"; }
  });

  useEffect(() => {
    document.documentElement.dataset.tema = tema;
    try { localStorage.setItem("achadinhos:tema", tema); } catch { /* ok */ }
  }, [tema]);

  useEffect(() => {
    const alvo = () => setAoTopo(window.scrollY > 900);
    window.addEventListener("scroll", alvo, { passive: true });
    return () => window.removeEventListener("scroll", alvo);
  }, []);

  // Filtro de texto separado dos demais: a busca muda a cada tecla, os chips
  // nao. Assim os contadores da barra lateral (que ignoram a categoria atual,
  // senao mostrariam 0 em todas as outras) so recalculam quando precisam.
  const porBusca = useMemo(() => {
    const q = semAcento(buscaLenta.trim());
    if (!q) return OFERTAS;
    const termos = q.split(/\s+/);
    return OFERTAS.filter((o) => termos.every((t) => o.busca.includes(t)));
  }, [buscaLenta]);

  const base = useMemo(() => porBusca.filter((o) => {
    const f = FAIXAS[faixa];
    if (o.preco < f.min || o.preco > f.max) return false;
    if (o.desconto < descMin) return false;
    if (soFrete && !o.frete) return false;
    if (soFavs && !favs.has(o.chave)) return false;
    return true;
  }), [porBusca, faixa, descMin, soFrete, soFavs, favs]);

  const porLoja = useMemo(() => {
    const c = dados.lojas.map(() => 0);
    for (const o of base) if (cat === -1 || o.cat === cat) c[o.loja]++;
    return c;
  }, [base, cat]);

  const porCat = useMemo(() => {
    const c: Record<number, number> = {};
    for (const o of base) if (loja === -1 || o.loja === loja) c[o.cat] = (c[o.cat] || 0) + 1;
    return c;
  }, [base, loja]);

  const filtradas = useMemo(
    () => base.filter((o) => (loja === -1 || o.loja === loja) && (cat === -1 || o.cat === cat)),
    [base, loja, cat]
  );

  const visiveis = useMemo(() => {
    const lista = filtradas.slice();
    switch (ordem) {
      case "desconto": lista.sort((a, b) => b.desconto - a.desconto); break;
      case "economia": lista.sort((a, b) => b.economia - a.economia); break;
      case "barato": lista.sort((a, b) => a.preco - b.preco); break;
      case "caro": lista.sort((a, b) => b.preco - a.preco); break;
      case "nota": lista.sort((a, b) => (b.avaliacao || 0) - (a.avaliacao || 0) || b.desconto - a.desconto); break;
      default: lista.sort((a, b) => b.peso - a.peso);
    }
    return lista;
  }, [filtradas, ordem]);

  // Qualquer mudanca de filtro volta a vitrine para a primeira "pagina":
  // sem isso, trocar de categoria mantinha 500 cards montados a toa.
  useEffect(() => { setLimite(dados.porPagina); }, [buscaLenta, loja, cat, faixa, descMin, soFrete, soFavs, ordem]);

  // Scroll infinito: o sentinela fica no fim da grade e libera mais uma pagina
  // quando entra na tela. Para de carregar sozinho em AUTO_MAX — sao milhares
  // de ofertas e uma rolagem longa acabaria com todas montadas no DOM; dai em
  // diante quem quiser continuar clica no "Ver mais".
  const sentinela = useRef<HTMLDivElement | null>(null);
  useEffect(() => {
    const el = sentinela.current;
    if (!el || limite >= visiveis.length || limite >= AUTO_MAX) return;
    const io = new IntersectionObserver((ents) => {
      if (ents.some((e) => e.isIntersecting)) setLimite((n) => n + dados.porPagina);
    }, { rootMargin: "600px" });
    io.observe(el);
    return () => io.disconnect();
  }, [limite, visiveis.length]);

  const limpar = useCallback(() => {
    setTexto(""); setLoja(-1); setCat(-1); setFaixa(0);
    setDescMin(0); setSoFrete(false); setSoFavs(false);
  }, []);

  const stats = useMemo(() => {
    // reduce em vez de Math.max(...array): com milhares de ofertas o spread
    // estoura o limite de argumentos da chamada em alguns navegadores.
    let soma = 0, maior = 0;
    for (const o of OFERTAS) { soma += o.desconto; if (o.desconto > maior) maior = o.desconto; }
    const n = OFERTAS.length;
    return { n, medio: n ? Math.round(soma / n) : 0, maior };
  }, []);

  const filtrando = Boolean(texto) || loja !== -1 || cat !== -1 || faixa !== 0
    || descMin > 0 || soFrete || soFavs;

  return (
    <>
      <header className="topo">
        <div className="topo-in">
          <a className="logo" href="#" onClick={(e) => { e.preventDefault(); window.scrollTo({ top: 0, behavior: "smooth" }); }} aria-label={dados.marca + " — voltar ao topo"}>
            {dados.logoIcone ? (
              <img className="logo-mark" src={dados.logoIcone} alt="" width={40} height={40} />
            ) : (
              <span className="logo-emo" aria-hidden="true">🔥</span>
            )}
            <span className="logo-txt">
              <span className="assinatura">{dados.assinatura}</span>
              <span className="nome">{dados.marca}</span>
            </span>
          </a>
          <div className="busca-wrap">
            <span className="busca-ico" aria-hidden="true">🔎</span>
            <input
              className="busca" type="search" value={texto}
              onChange={(e) => setTexto(e.target.value)}
              placeholder={"Buscar entre " + inteiro(OFERTAS.length) + " ofertas..."}
              aria-label="Buscar produto" autoComplete="off"
            />
            {texto ? (
              <button className="busca-x" onClick={() => setTexto("")} aria-label="Limpar busca">✕</button>
            ) : null}
          </div>
          <button
            className="icone-btn" onClick={() => setTema(tema === "claro" ? "escuro" : "claro")}
            aria-label="Alternar tema" title="Alternar tema claro/escuro"
          >{tema === "claro" ? "🌙" : "☀️"}</button>
        </div>
      </header>

      <div className="wrap">
        <section className="hero">
          <div className="marca-hero">
            {dados.logoHero ? (
              <img
                className="avatar" src={dados.logoHero}
                alt={dados.assinatura + " " + dados.marca}
                width={138} height={138} fetchpriority="high"
              />
            ) : (
              <div className="avatar-fb" aria-hidden="true">🛍️</div>
            )}
          </div>
          {/* Data real da geracao, nao "hoje" generico: e o que da confianca
              numa vitrine de promocoes — e sai de graca, ja esta no payload. */}
          <div className="selo">
            <span className="pulso" aria-hidden="true"></span>
            Vitrine atualizada em {dados.gerado}
          </div>
          {/* O nome ja esta na arte do logo (e no alt dela) logo acima: escrito
              de novo aqui, aparecia duas vezes seguidas. O h1 continua existindo
              para buscador e leitor de tela — so nao e mais desenhado. */}
          <h1 className="so-leitor">{dados.assinatura} {dados.marca}</h1>
          <p className="bio">{dados.bio}</p>
          <div className="stats">
            <div className="stat"><b>{inteiro(stats.n)}</b><span>ofertas</span></div>
            <div className="stat"><b>{stats.medio}%</b><span>desconto médio</span></div>
            <div className="stat"><b>{stats.maior}%</b><span>maior desconto</span></div>
            <div className="stat"><b>{CATS_ATIVAS.length}</b><span>categorias</span></div>
          </div>
          {dados.redes.length ? (
            <nav className="redes">
              {dados.redes.map(([nome, link]) => (
                <a className="rede" key={nome} href={link} target="_blank" rel="noopener">{nome}</a>
              ))}
            </nav>
          ) : null}
        </section>

        <div className="conteudo">
          <Filtros
            aberto={gaveta} fechar={() => setGaveta(false)}
            loja={loja} setLoja={setLoja} cat={cat} setCat={setCat}
            faixa={faixa} setFaixa={setFaixa} descMin={descMin} setDescMin={setDescMin}
            soFrete={soFrete} setSoFrete={setSoFrete} soFavs={soFavs} setSoFavs={setSoFavs}
            totalFavs={favs.size} porLoja={porLoja} porCat={porCat} total={base.length}
            limpar={limpar}
          />
          {gaveta ? <button className="veu" onClick={() => setGaveta(false)} aria-label="Fechar filtros" /> : null}

          <main>
            <div className="barra">
              <div>
                <h2>{cat === -1 ? "🔥 Todas as ofertas" : dados.cats[cat][0] + " " + dados.cats[cat][1]}</h2>
                <div className="contador">
                  {inteiro(visiveis.length)} {visiveis.length === 1 ? "oferta" : "ofertas"}
                  {filtrando ? " de " + inteiro(OFERTAS.length) : ""}
                </div>
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <button className="abrir-filtros" onClick={() => setGaveta(true)}>⚙️ Filtros</button>
                <select
                  className="ordem" value={ordem}
                  onChange={(e) => setOrdem(e.target.value as Ordem)} aria-label="Ordenar por"
                >
                  {ORDENS.map(([v, r]) => <option key={v} value={v}>{r}</option>)}
                </select>
              </div>
            </div>

            {filtrando ? (
              <div className="marcas">
                {texto ? <span className="marca-tag">“{texto}”<button onClick={() => setTexto("")} aria-label="Remover">✕</button></span> : null}
                {loja !== -1 ? <span className="marca-tag">{dados.lojas[loja][0]}<button onClick={() => setLoja(-1)} aria-label="Remover">✕</button></span> : null}
                {cat !== -1 ? <span className="marca-tag">{dados.cats[cat][0]} {dados.cats[cat][1]}<button onClick={() => setCat(-1)} aria-label="Remover">✕</button></span> : null}
                {faixa !== 0 ? <span className="marca-tag">{FAIXAS[faixa].rotulo}<button onClick={() => setFaixa(0)} aria-label="Remover">✕</button></span> : null}
                {descMin > 0 ? <span className="marca-tag">{descMin}%+<button onClick={() => setDescMin(0)} aria-label="Remover">✕</button></span> : null}
                {soFrete ? <span className="marca-tag">🚚 frete grátis<button onClick={() => setSoFrete(false)} aria-label="Remover">✕</button></span> : null}
                {soFavs ? <span className="marca-tag">❤️ favoritos<button onClick={() => setSoFavs(false)} aria-label="Remover">✕</button></span> : null}
              </div>
            ) : null}

            {visiveis.length === 0 ? (
              <div className="vazio">
                <b>Nada encontrado por aqui 🤔</b>
                Tente outra palavra ou afrouxe os filtros.
              </div>
            ) : (
              <>
                <div className="grade">
                  {visiveis.slice(0, limite).map((o) => (
                    <CardMemo key={o.id} o={o} favorito={favs.has(o.chave)} aoFavoritar={alternarFav} />
                  ))}
                </div>
                <div ref={sentinela} />
                {limite < visiveis.length ? (
                  <div className="mais">
                    <button onClick={() => setLimite((n) => n + dados.porPagina * 2)}>
                      Ver mais ofertas ({inteiro(visiveis.length - limite)} restantes)
                    </button>
                  </div>
                ) : (
                  <p className="fim">Você viu todas as {inteiro(visiveis.length)} ofertas deste filtro 🎉</p>
                )}
              </>
            )}
          </main>
        </div>
      </div>

      {aoTopo ? (
        <button className="topo-btn" onClick={() => window.scrollTo({ top: 0, behavior: "smooth" })} aria-label="Voltar ao topo">↑</button>
      ) : null}

      <footer>
        <div className="wrap">
          {dados.logoIcone ? (
            <img className="rodape-logo" src={dados.logoIcone} alt="" width={48} height={48} loading="lazy" />
          ) : null}
          Como afiliado do Mercado Livre e da Amazon, posso receber comissão pelas compras qualificadas.<br />
          Preços sujeitos a alteração. Atualizado em {dados.gerado}.
          <div className="copyright">{new Date().getFullYear()} © {dados.assinatura} · {dados.marca} — Todos os direitos reservados</div>
        </div>
      </footer>
    </>
  );
}

const raiz = document.getElementById("raiz") as HTMLElement;
ReactDOM.createRoot(raiz).render(<App />);

  </script>
</body>
</html>
